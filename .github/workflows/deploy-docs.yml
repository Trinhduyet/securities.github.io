name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Pages publishing mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("build_type", ""))')"
          echo "GitHub Pages build_type=${build_type}"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages is still using legacy branch publishing. Settings → Pages → Build and deployment → Source must be GitHub Actions. Legacy pages-build-deployment serves docs/ directly, so VitePress JS/Mermaid/static routes are bypassed."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build VitePress
        run: npm run build

      - name: Verify critical static routes
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            docs/.vitepress/dist/index.html
            docs/.vitepress/dist/lectures/index.html
            docs/.vitepress/dist/domains/index.html
            docs/.vitepress/dist/case-studies/index.html
            docs/.vitepress/dist/engineering/index.html
            docs/.vitepress/dist/projects/index.html
            docs/.vitepress/dist/resources/index.html
          )

          for file in "${critical[@]}"; do
            test -s "$file" || {
              echo "::error::Missing critical VitePress output: $file"
              exit 1
            }
          done

          grep -q '/securities.github.io/' docs/.vitepress/dist/lectures/index.html || {
            echo '::error::lectures/index.html was built without the /securities.github.io/ base path'
            exit 1
          }

          grep -q '/securities.github.io/' docs/.vitepress/dist/domains/index.html || {
            echo '::error::domains/index.html was built without the /securities.github.io/ base path'
            exit 1
          }

          echo 'Critical static routes and project base verified.'

      - name: Audit secondary routes
        continue-on-error: true
        run: npm run check:routes

      - name: Write deployment metadata
        shell: bash
        run: |
          cat > docs/.vitepress/dist/deploy-meta.json <<EOF
          {
            "repository": "Trinhduyet/securities.github.io",
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "generator": "VitePress",
            "base": "/securities.github.io/"
          }
          EOF

      - name: Show generated critical routes
        shell: bash
        run: |
          ls -lh \
            docs/.vitepress/dist/index.html \
            docs/.vitepress/dist/lectures/index.html \
            docs/.vitepress/dist/domains/index.html \
            docs/.vitepress/dist/engineering/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site serves this workflow artifact
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          marker_url="${base}/deploy-meta.json"
          echo "Waiting for ${marker_url} to expose commit ${GITHUB_SHA}"

          for attempt in $(seq 1 12); do
            body="$(curl -fsSL -H 'Cache-Control: no-cache' "${marker_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "\"commit\": \"${GITHUB_SHA}\""; then
              echo "Live VitePress artifact verified on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: live marker is not this commit yet."
            sleep 10
          done

          echo "::error::GitHub Pages did not serve deploy-meta.json for commit ${GITHUB_SHA}. Check Settings → Pages → Source = GitHub Actions and ensure no legacy pages-build-deployment is active."
          exit 1
